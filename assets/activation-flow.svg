<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="300" viewBox="0 0 1300 300" role="img" aria-labelledby="title desc">
<title id="title">TermLog automatic activation flow</title>
<desc id="desc">A new Terminator tab is silent by default, manual termlog start activates recording, a subsequent tab offers an optional prompt, and the state turns off when the final session ends.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071520"/><stop offset="1" stop-color="#0b2530"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#51cbb5"/></marker></defs>
<rect width="1300" height="300" fill="url(#bg)" rx="20"/>
<text x="48" y="55" fill="#e8f8f7" font-size="27" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">Manual first. Automatic only when it matters.</text>
<rect x="46" y="112" width="258" height="132" rx="14" fill="#102a34" stroke="#27606a" stroke-width="1.5"/><text x="67" y="153" fill="#50e2c9" font-size="18" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="67" y="188" fill="#f3fafb" font-size="16" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">OPEN TERMINATOR</text><text x="67" y="218" fill="#91aeba" font-size="14" font-family="DejaVu Sans,Arial,sans-serif">No prompt · no recording</text><rect x="363" y="112" width="258" height="132" rx="14" fill="#102a34" stroke="#27606a" stroke-width="1.5"/><text x="384" y="153" fill="#50e2c9" font-size="18" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">02</text><text x="384" y="188" fill="#f3fafb" font-size="16" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">RUN termlog start</text><text x="384" y="218" fill="#91aeba" font-size="14" font-family="DejaVu Sans,Arial,sans-serif">Manual session begins</text><rect x="680" y="112" width="258" height="132" rx="14" fill="#102a34" stroke="#27606a" stroke-width="1.5"/><text x="701" y="153" fill="#50e2c9" font-size="18" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">03</text><text x="701" y="188" fill="#f3fafb" font-size="16" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">OPEN A NEW TAB</text><text x="701" y="218" fill="#91aeba" font-size="14" font-family="DejaVu Sans,Arial,sans-serif">Choose [Y/n] to record</text><rect x="997" y="112" width="258" height="132" rx="14" fill="#102a34" stroke="#27606a" stroke-width="1.5"/><text x="1018" y="153" fill="#50e2c9" font-size="18" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">04</text><text x="1018" y="188" fill="#f3fafb" font-size="16" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">FINISH ALL SESSIONS</text><text x="1018" y="218" fill="#91aeba" font-size="14" font-family="DejaVu Sans,Arial,sans-serif">Automatic prompts stop</text><path d="M310 178 H353" stroke="#51cbb5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M627 178 H670" stroke="#51cbb5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M944 178 H987" stroke="#51cbb5" stroke-width="2.5" marker-end="url(#arrow)"/><text x="48" y="278" fill="#86a5af" font-size="14" font-family="DejaVu Sans,Arial,sans-serif">The final active recording ends the shared active state. New tabs return to normal.</text></svg>